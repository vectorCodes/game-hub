<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The GameHub seal (components/Logo.tsx): a gold square, a sun, and the ink shadow it casts. -->
  <defs>
    <clipPath id="sun"><circle cx="15" cy="15" r="7.5" /></clipPath>
  </defs>
  <rect width="32" height="32" rx="5" fill="#cc922f" />
  <circle cx="15" cy="15" r="7.5" fill="#d9582c" />
  <circle cx="19" cy="19" r="7.5" fill="#221304" />
  <circle cx="19" cy="19" r="7.5" fill="#240c04" clip-path="url(#sun)" />
</svg>
